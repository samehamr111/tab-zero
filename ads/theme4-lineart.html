<!doctype html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .canvas{width:1080px; height:1080px; background:#FFFFFF; font-family:"Public Sans",sans-serif; display:flex; flex-direction:column; padding:96px;}
  .icon{margin-bottom:44px;}
  .eyebrow{font-family:"JetBrains Mono",monospace; font-size:15px; letter-spacing:.1em; text-transform:uppercase; color:#000000; margin-bottom:26px; font-weight:500;}
  h1{font-family:"Public Sans",sans-serif; font-weight:300; font-size:58px; line-height:1.28; color:#000000; max-width:820px;}
  h1 b{font-weight:700;}
  .sub{font-size:22px; line-height:1.6; color:#000000; max-width:600px; margin-top:32px; font-weight:400;}
  .sub .u{border-bottom:2px solid #4F46E5; padding-bottom:1px;}
  .spacer{flex:1;}
  .rule{height:1px; background:#000000; margin-bottom:40px;}
  .footer{display:flex; align-items:center; justify-content:space-between;}
  .logo{display:flex; align-items:center; gap:12px;} .logo svg{width:32px; height:25px;}
  .logo-text{font-family:"Public Sans",sans-serif; font-weight:700; font-size:24px; color:#000000;} .logo-text span{color:#4F46E5;}
  .cta{background:#4F46E5; color:#FFFFFF; font-weight:600; font-size:21px; padding:17px 34px; border-radius:2px;}
</style></head>
<body>
<div class="canvas">
  <svg class="icon" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="32" cy="32" r="27" stroke="#000000" stroke-width="1.6"/>
    <path d="M32 17V32L42 39" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="eyebrow">tab-zero</div>
  <h1>It's 11pm. You're refreshing Search Console for the <b>fifth</b> time tonight.</h1>
  <p class="sub">Semrush tells you what's actually wrong — so you can <span class="u">close the tab</span> and go to bed.</p>

  <div class="spacer"></div>

  <div class="rule"></div>
  <div class="footer">
    <div class="logo">
      <svg viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="1.2" width="24" height="18.8" rx="4" stroke="#000000" stroke-width="1.7"/>
        <path d="M9.5 6.1L18.5 15.1M18.5 6.1L9.5 15.1" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">tab-<span>zero</span></span>
    </div>
    <div class="cta">Start free trial →</div>
  </div>
</div>
</body></html>
