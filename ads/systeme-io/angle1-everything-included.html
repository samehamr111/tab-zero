<!doctype html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .canvas{
    width:1080px; height:1080px;
    background:#F3F4F6;
    font-family:"Public Sans",sans-serif;
    display:flex; flex-direction:column;
    padding:64px 72px 56px;
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:20px; letter-spacing:.08em; text-transform:uppercase;
    color:#1E6F5C; margin-bottom:14px; font-weight:600;
  }
  h1{
    font-family:"Fraunces",serif; font-weight:700;
    font-size:56px; line-height:1.1; color:#1B1F2A;
    max-width:820px;
  }
  .grid{
    margin-top:44px;
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
  }
  .item{
    display:flex; align-items:center; gap:14px;
    background:#FFFFFF; border:1px solid #E1E4EA; border-radius:12px;
    padding:20px 22px; font-size:24px; font-weight:600; color:#1B1F2A;
  }
  .item svg{flex:none;}
  .spacer{flex:1;}
  .callout{
    display:inline-flex; align-self:flex-start;
    font-family:"JetBrains Mono",monospace; font-weight:600; font-size:28px;
    background:#E1EFEA; color:#1E6F5C;
    padding:16px 28px; border-radius:12px; margin-top:26px;
  }
  .footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:36px;
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:38px; height:30px;}
  .logo-text{font-family:"Fraunces",serif; font-weight:700; font-size:30px; color:#1B1F2A;}
  .logo-text span{color:#B14E20;}
  .cta{
    background:#B14E20; color:#FFFFFF;
    font-weight:700; font-size:28px;
    padding:20px 44px; border-radius:100px;
  }
</style></head>
<body>
<div class="canvas">
  <div class="eyebrow">All-in-one marketing platform</div>
  <h1>Eight tools. One plan. Free to start.</h1>

  <div class="grid">
    <div class="item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 6" stroke="#1E6F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Sales funnels</div>
    <div class="item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 6" stroke="#1E6F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Email marketing</div>
    <div class="item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 6" stroke="#1E6F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Website builder</div>
    <div class="item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 6" stroke="#1E6F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Online courses</div>
    <div class="item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 6" stroke="#1E6F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>CRM pipelines</div>
    <div class="item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 6" stroke="#1E6F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Affiliate program</div>
    <div class="item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 6" stroke="#1E6F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Community builder</div>
    <div class="item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 6" stroke="#1E6F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Webinars</div>
  </div>

  <div class="callout">$0 / month — no card required</div>

  <div class="spacer"></div>

  <div class="footer">
    <div class="logo">
      <svg viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="1.2" width="24" height="18.8" rx="4" stroke="#1B1F2A" stroke-width="2.2"/>
        <path d="M9.5 6.1L18.5 15.1M18.5 6.1L9.5 15.1" stroke="#B14E20" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">tab-<span>zero</span></span>
    </div>
    <div class="cta">See how it works</div>
  </div>
</div>
</body></html>
