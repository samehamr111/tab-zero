<!doctype html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .canvas{
    width:1080px; height:1080px;
    background:#F3F4F6;
    font-family:"Public Sans",sans-serif;
    display:flex; flex-direction:column;
  }
  .browser{
    margin:56px 56px 0;
    border-radius:16px;
    overflow:hidden;
    border:2px solid #E1E4EA;
    box-shadow:0 30px 60px -30px rgba(20,20,30,.15);
  }
  .tabbar{
    background:#EBEDF1;
    display:flex; align-items:flex-end;
    padding:12px 10px 0;
    gap:3px;
  }
  .tab{
    background:#FFFFFF;
    border-radius:9px 9px 0 0;
    padding:12px 14px;
    display:flex; align-items:center; gap:7px;
    font-size:14px; color:#5B6472; font-weight:600;
    white-space:nowrap;
    flex:1;
    min-width:0;
    overflow:hidden;
    justify-content:center;
  }
  .dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .addressbar{background:#FFFFFF; padding:14px 24px;}
  .addressbar .pill{background:#EBEDF1; border-radius:8px; height:24px; width:340px;}
  .page{
    background:#FFFFFF;
    padding:32px 40px 44px;
    display:flex; flex-direction:column; gap:16px;
  }
  .block{background:#EBEDF1; border-radius:8px;}
  .headline-card{
    margin:0 56px;
    margin-top:-8px;
    background:#FFFFFF;
    border-radius:18px;
    padding:44px 48px 48px;
    box-shadow:0 30px 60px -24px rgba(20,20,30,.2);
    position:relative;
    z-index:2;
  }
  .headline-card h1{
    font-family:"Fraunces",serif; font-weight:700;
    font-size:56px; line-height:1.14; color:#1B1F2A;
  }
  .highlight{
    background:#B14E20; color:#FFFFFF;
    padding:2px 10px; border-radius:6px;
    display:inline-block;
  }
  .footer{
    flex:1;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 56px 48px;
    max-height:120px;
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:38px; height:30px;}
  .logo-text{font-family:"Fraunces",serif; font-weight:700; font-size:30px; color:#1B1F2A;}
  .logo-text span{color:#B14E20;}
  .cta{
    background:#B14E20; color:#FFFFFF;
    font-weight:700; font-size:28px;
    padding:20px 44px; border-radius:100px;
  }
</style></head>
<body>
<div class="canvas">

  <div class="browser">
    <div class="tabbar">
      <div class="tab"><span class="dot" style="background:#1E6F5C"></span>keyword-tool.co…</div>
      <div class="tab"><span class="dot" style="background:#B14E20"></span>rank-check…</div>
      <div class="tab"><span class="dot" style="background:#C87F3A"></span>competitor-sp…</div>
      <div class="tab"><span class="dot" style="background:#1E6F5C"></span>site-audit…</div>
      <div class="tab"><span class="dot" style="background:#5B6472"></span>Sheet – Untitled</div>
      <div class="tab"><span class="dot" style="background:#B14E20"></span>Notes</div>
    </div>
    <div class="addressbar"><div class="pill"></div></div>
    <div class="page">
      <div class="block" style="height:22px; width:55%;"></div>
      <div class="block" style="height:22px; width:35%;"></div>
      <div class="block" style="height:160px; width:100%; margin-top:8px;"></div>
      <div style="display:flex; gap:16px;">
        <div class="block" style="height:80px; flex:1;"></div>
        <div class="block" style="height:80px; flex:1;"></div>
        <div class="block" style="height:80px; flex:1;"></div>
        <div class="block" style="height:80px; flex:1;"></div>
      </div>
    </div>
  </div>

  <div class="headline-card">
    <h1>6 tabs open.<br>Still <span class="highlight">don't know why.</span></h1>
  </div>

  <div class="footer">
    <div class="logo">
      <svg viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="1.2" width="24" height="18.8" rx="4" stroke="#1B1F2A" stroke-width="2.2"/>
        <path d="M9.5 6.1L18.5 15.1M18.5 6.1L9.5 15.1" stroke="#B14E20" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">tab-<span>zero</span></span>
    </div>
    <div class="cta">Start Free Trial</div>
  </div>
</div>
</body></html>
