<!doctype html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .canvas{
    width:1080px; height:1080px;
    background:#F3F4F6;
    font-family:"Public Sans",sans-serif;
    display:flex; flex-direction:column;
    padding:64px 72px 56px;
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:20px; letter-spacing:.08em; text-transform:uppercase;
    color:#1E6F5C; margin-bottom:14px; font-weight:600;
  }
  h1{
    font-family:"Fraunces",serif; font-weight:700;
    font-size:48px; line-height:1.14; color:#1B1F2A;
    max-width:900px;
  }
  .docs{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:32px; margin-top:44px;}
  .doc{background:#FFFFFF; border:1px solid #E1E4EA; border-radius:14px; padding:30px; display:flex; flex-direction:column; gap:12px;}
  .doc-label{font-family:"JetBrains Mono",monospace; font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px;}
  .doc.before .doc-label{color:#B14E20;}
  .doc.after .doc-label{color:#1E6F5C;}
  .line{height:14px; background:#EBEDF1; border-radius:3px; width:100%;}
  .line.short{width:70%;}
  .redact-bad{
    height:14px; border-radius:3px; width:55%;
    background:repeating-linear-gradient(45deg,#1B1F2A,#1B1F2A 6px,#3a3f4a 6px,#3a3f4a 12px);
    border:1px dashed #B14E20;
  }
  .redact-good{height:14px; border-radius:3px; width:55%; background:#1B1F2A;}
  .doc-note{margin-top:auto; font-size:14px; color:#5B6472; padding-top:10px; border-top:1px solid #E1E4EA;}
  .footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:36px;
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:38px; height:30px;}
  .logo-text{font-family:"Fraunces",serif; font-weight:700; font-size:30px; color:#1B1F2A;}
  .logo-text span{color:#B14E20;}
  .cta{
    background:#B14E20; color:#FFFFFF;
    font-weight:700; font-size:28px;
    padding:20px 44px; border-radius:100px;
  }
</style></head>
<body>
<div class="canvas">
  <div class="eyebrow">Real redaction vs. a black box</div>
  <h1>One of these can be lifted right out of the file.</h1>

  <div class="docs">
    <div class="doc before">
      <div class="doc-label">Black box overlay</div>
      <div class="line"></div>
      <div class="redact-bad"></div>
      <div class="line short"></div>
      <div class="line"></div>
      <div class="redact-bad" style="width:40%"></div>
      <div class="line"></div>
      <div class="line short"></div>
      <div class="redact-bad" style="width:65%"></div>
      <div class="line"></div>
      <div class="doc-note">Text is still there underneath — just visually covered.</div>
    </div>
    <div class="doc after">
      <div class="doc-label">True removal</div>
      <div class="line"></div>
      <div class="redact-good"></div>
      <div class="line short"></div>
      <div class="line"></div>
      <div class="redact-good" style="width:40%"></div>
      <div class="line"></div>
      <div class="line short"></div>
      <div class="redact-good" style="width:65%"></div>
      <div class="line"></div>
      <div class="doc-note">Text is permanently gone from the file, with a log of the change.</div>
    </div>
  </div>

  <div class="footer">
    <div class="logo">
      <svg viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="1.2" width="24" height="18.8" rx="4" stroke="#1B1F2A" stroke-width="2.2"/>
        <path d="M9.5 6.1L18.5 15.1M18.5 6.1L9.5 15.1" stroke="#B14E20" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">tab-<span>zero</span></span>
    </div>
    <div class="cta">See how it works</div>
  </div>
</div>
</body></html>
