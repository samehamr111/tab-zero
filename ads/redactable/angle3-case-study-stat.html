<!doctype html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .canvas{
    width:1080px; height:1080px;
    background:#F3F4F6;
    font-family:"Public Sans",sans-serif;
    display:flex; flex-direction:column;
    padding:64px 72px 56px;
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:20px; letter-spacing:.08em; text-transform:uppercase;
    color:#1E6F5C; margin-bottom:30px; font-weight:600;
  }
  .case{display:flex; align-items:center; gap:36px;}
  .num-block{text-align:center;}
  .num{font-family:"Fraunces",serif; font-weight:700; font-size:96px; color:#1B1F2A; line-height:1;}
  .num-label{font-family:"JetBrains Mono",monospace; font-size:14px; color:#5B6472; margin-top:6px;}
  .arrow-big{font-size:48px; color:#B14E20;}
  .result-num{font-family:"Fraunces",serif; font-weight:700; font-size:96px; color:#1E6F5C; line-height:1;}
  .quote-block{
    margin-top:56px; background:#FFFFFF; border:1px solid #E1E4EA; border-radius:16px;
    padding:36px 40px;
  }
  .quote{font-family:"Fraunces",serif; font-weight:600; font-size:28px; line-height:1.4; color:#1B1F2A;}
  .who{margin-top:20px; font-size:15px; color:#5B6472;}
  .who strong{color:#1B1F2A;}
  .spacer{flex:1;}
  .footer{
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:38px; height:30px;}
  .logo-text{font-family:"Fraunces",serif; font-weight:700; font-size:30px; color:#1B1F2A;}
  .logo-text span{color:#B14E20;}
  .cta{
    background:#B14E20; color:#FFFFFF;
    font-weight:700; font-size:28px;
    padding:20px 44px; border-radius:100px;
  }
</style></head>
<body>
<div class="canvas">
  <div class="eyebrow">One real redaction project</div>

  <div class="case">
    <div class="num-block">
      <div class="num">1,000</div>
      <div class="num-label">pages of medical records</div>
    </div>
    <div class="arrow-big">→</div>
    <div class="num-block">
      <div class="result-num">30+</div>
      <div class="num-label">hours saved vs. by hand</div>
    </div>
  </div>

  <div class="quote-block">
    <div class="quote">&ldquo;This saved me about 30+ hours on a project with about 1,000 pages of medical records vs. doing it by hand.&rdquo;</div>
    <div class="who"><strong>Ayida G.</strong> — Systems Engineer</div>
  </div>

  <div class="spacer"></div>

  <div class="footer">
    <div class="logo">
      <svg viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="1.2" width="24" height="18.8" rx="4" stroke="#1B1F2A" stroke-width="2.2"/>
        <path d="M9.5 6.1L18.5 15.1M18.5 6.1L9.5 15.1" stroke="#B14E20" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">tab-<span>zero</span></span>
    </div>
    <div class="cta">See how it works</div>
  </div>
</div>
</body></html>
