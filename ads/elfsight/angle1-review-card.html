<!doctype html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .canvas{
    width:1080px; height:1080px;
    background:#F3F4F6;
    font-family:"Public Sans",sans-serif;
    display:flex; flex-direction:column;
    padding:80px;
  }
  .card{
    background:#FFFFFF; border:1px solid #E1E4EA; border-radius:20px;
    padding:52px 48px; box-shadow:0 24px 60px -30px rgba(20,20,30,.25);
    margin-top:120px;
  }
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:30px;}
  .platform-dots{display:flex; gap:8px;}
  .dot{width:11px; height:11px; border-radius:50%; background:#E1E4EA;}
  .verified{
    font-family:"JetBrains Mono",monospace; font-size:14px; color:#1E6F5C;
    background:#E1EFEA; padding:6px 14px; border-radius:100px;
  }
  .stars{color:#B14E20; font-size:32px; letter-spacing:.06em; margin-bottom:24px;}
  .quote{
    font-family:"Fraunces",serif; font-weight:600; font-size:38px; line-height:1.35; color:#1B1F2A;
  }
  .who{display:flex; align-items:center; gap:14px; margin-top:34px;}
  .avatar{
    width:52px; height:52px; border-radius:50%; background:#1E6F5C; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces",serif; font-weight:700; font-size:22px;
  }
  .who-name{font-weight:700; color:#1B1F2A; font-size:18px;}
  .who-role{font-size:14px; color:#5B6472;}
  .footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:auto;
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:38px; height:30px;}
  .logo-text{font-family:"Fraunces",serif; font-weight:700; font-size:30px; color:#1B1F2A;}
  .logo-text span{color:#B14E20;}
  .cta{
    background:#B14E20; color:#FFFFFF;
    font-weight:700; font-size:28px;
    padding:20px 44px; border-radius:100px;
  }
</style></head>
<body>
<div class="canvas">
  <div class="card">
    <div class="card-head">
      <div class="platform-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <span class="verified">Verified review · 1,068+ on record</span>
    </div>
    <div class="stars">★★★★★</div>
    <div class="quote">&ldquo;They don't sneak in cookies and advertising crap. The widgets work seamlessly.&rdquo;</div>
    <div class="who">
      <div class="avatar">K</div>
      <div>
        <div class="who-name">Kristen P.</div>
        <div class="who-role">Agency owner</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="logo">
      <svg viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="1.2" width="24" height="18.8" rx="4" stroke="#1B1F2A" stroke-width="2.2"/>
        <path d="M9.5 6.1L18.5 15.1M18.5 6.1L9.5 15.1" stroke="#B14E20" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">tab-<span>zero</span></span>
    </div>
    <div class="cta">See how it works</div>
  </div>
</div>
</body></html>
