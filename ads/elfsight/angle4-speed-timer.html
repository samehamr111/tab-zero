<!doctype html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .canvas{
    width:1080px; height:1080px;
    background:#F3F4F6;
    font-family:"Public Sans",sans-serif;
    display:flex; flex-direction:column;
    padding:64px 72px 56px;
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:20px; letter-spacing:.08em; text-transform:uppercase;
    color:#1E6F5C; margin-bottom:14px; font-weight:600;
  }
  h1{
    font-family:"Fraunces",serif; font-weight:700;
    font-size:50px; line-height:1.12; color:#1B1F2A;
    max-width:880px;
  }
  .timeline{flex:1; display:flex; flex-direction:column; justify-content:center; gap:28px; margin-top:20px;}
  .stage{display:flex; align-items:center; gap:28px;}
  .clock{
    width:96px; height:96px; border-radius:50%; flex:none;
    border:6px solid #C7CBD4; position:relative;
  }
  .clock.fast{border-color:#1E6F5C;}
  .clock::after{
    content:""; position:absolute; top:50%; left:50%; width:2px; height:30px; background:#C7CBD4;
    transform:translate(-50%,-100%) rotate(35deg); transform-origin:bottom;
  }
  .clock.fast::after{background:#1E6F5C; height:22px; transform:translate(-50%,-100%) rotate(90deg);}
  .stage-text .label{font-family:"Fraunces",serif; font-weight:700; font-size:40px; color:#1B1F2A;}
  .stage-text .sub{font-size:18px; color:#5B6472; margin-top:4px;}
  .stage.old .label{color:#8A9186; text-decoration:line-through; text-decoration-color:#B14E20; text-decoration-thickness:3px;}
  .arrow-down{font-size:32px; color:#B14E20; margin-left:48px;}
  .footer{
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:38px; height:30px;}
  .logo-text{font-family:"Fraunces",serif; font-weight:700; font-size:30px; color:#1B1F2A;}
  .logo-text span{color:#B14E20;}
  .cta{
    background:#B14E20; color:#FFFFFF;
    font-weight:700; font-size:28px;
    padding:20px 44px; border-radius:100px;
  }
</style></head>
<body>
<div class="canvas">
  <div class="eyebrow">A review widget, two ways</div>
  <h1>A dev backlog took two months. This takes about a minute.</h1>

  <div class="timeline">
    <div class="stage old">
      <div class="clock"></div>
      <div class="stage-text">
        <div class="label">8 weeks</div>
        <div class="sub">Waiting on a developer ticket</div>
      </div>
    </div>
    <div class="arrow-down">↓</div>
    <div class="stage">
      <div class="clock fast"></div>
      <div class="stage-text">
        <div class="label">~60 seconds</div>
        <div class="sub">Copy the embed code, paste it, live</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="logo">
      <svg viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="1.2" width="24" height="18.8" rx="4" stroke="#1B1F2A" stroke-width="2.2"/>
        <path d="M9.5 6.1L18.5 15.1M18.5 6.1L9.5 15.1" stroke="#B14E20" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">tab-<span>zero</span></span>
    </div>
    <div class="cta">See how it works</div>
  </div>
</div>
</body></html>
