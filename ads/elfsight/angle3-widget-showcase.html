<!doctype html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .canvas{
    width:1080px; height:1080px;
    background:#F3F4F6;
    font-family:"Public Sans",sans-serif;
    display:flex; flex-direction:column;
    padding:60px 68px 48px;
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:18px; letter-spacing:.08em; text-transform:uppercase;
    color:#1E6F5C; margin-bottom:10px; font-weight:600;
  }
  h1{
    font-family:"Fraunces",serif; font-weight:700;
    font-size:38px; line-height:1.15; color:#1B1F2A;
    max-width:820px; margin-bottom:28px;
  }
  .browser{
    flex:1; background:#FFFFFF; border:1px solid #E1E4EA; border-radius:16px;
    overflow:hidden; position:relative; box-shadow:0 20px 50px -28px rgba(20,20,30,.25);
  }
  .browser-bar{
    background:#EBEDF1; padding:14px 18px; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid #E1E4EA;
  }
  .bdot{width:10px; height:10px; border-radius:50%; background:#D8DBE0;}
  .burl{
    margin-left:14px; background:#FFFFFF; border:1px solid #E1E4EA; border-radius:100px;
    padding:6px 16px; font-family:"JetBrains Mono",monospace; font-size:13px; color:#5B6472;
  }
  .page{position:relative; height:calc(100% - 46px); background:#FAFAFB;}
  .badge{
    position:absolute; background:#FFFFFF; border:1px solid #E1E4EA; border-radius:12px;
    padding:12px 16px; font-size:15px; font-weight:600; color:#1B1F2A;
    display:flex; align-items:center; gap:8px; box-shadow:0 10px 24px -14px rgba(20,20,30,.2);
  }
  .badge .dot{width:8px; height:8px; border-radius:50%; background:#1E6F5C;}
  .b1{top:36px; left:36px;}
  .b2{top:36px; right:36px;}
  .b3{top:150px; left:36px;}
  .b4{bottom:36px; right:36px; background:#1B1F2A; color:#fff; border-color:#1B1F2A;}
  .b4 .dot{background:#F0824B;}
  .b5{bottom:130px; left:80px;}
  .footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:28px;
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:38px; height:30px;}
  .logo-text{font-family:"Fraunces",serif; font-weight:700; font-size:30px; color:#1B1F2A;}
  .logo-text span{color:#B14E20;}
  .cta{
    background:#B14E20; color:#FFFFFF;
    font-weight:700; font-size:28px;
    padding:20px 44px; border-radius:100px;
  }
</style></head>
<body>
<div class="canvas">
  <div class="eyebrow">One site, every widget it needs</div>
  <h1>Reviews, chat, popups, and forms — all dropped onto the same site.</h1>

  <div class="browser">
    <div class="browser-bar">
      <span class="bdot"></span><span class="bdot"></span><span class="bdot"></span>
      <span class="burl">yoursite.com</span>
    </div>
    <div class="page">
      <div class="badge b1"><span class="dot"></span>★★★★★ Google Reviews</div>
      <div class="badge b2"><span class="dot"></span>Instagram Feed</div>
      <div class="badge b3"><span class="dot"></span>Countdown Timer</div>
      <div class="badge b5"><span class="dot"></span>Popup Form</div>
      <div class="badge b4"><span class="dot"></span>WhatsApp Chat</div>
    </div>
  </div>

  <div class="footer">
    <div class="logo">
      <svg viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="1.2" width="24" height="18.8" rx="4" stroke="#1B1F2A" stroke-width="2.2"/>
        <path d="M9.5 6.1L18.5 15.1M18.5 6.1L9.5 15.1" stroke="#B14E20" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">tab-<span>zero</span></span>
    </div>
    <div class="cta">See how it works</div>
  </div>
</div>
</body></html>
