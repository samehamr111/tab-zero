<!doctype html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  .canvas{
    width:1080px; height:1080px;
    background:#F3F4F6;
    font-family:"Public Sans",sans-serif;
    display:flex; flex-direction:column;
    padding:72px 76px 56px;
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:20px; letter-spacing:.08em; text-transform:uppercase;
    color:#1E6F5C; margin-bottom:40px; font-weight:600;
  }
  .qmark{
    font-family:"Fraunces",serif; font-weight:700; font-size:60px; color:#B14E20; line-height:1;
    margin-bottom:18px;
  }
  .question{
    font-family:"Fraunces",serif; font-weight:700;
    font-size:50px; line-height:1.18; color:#1B1F2A;
    max-width:820px;
  }
  .divider{height:1px; background:#D8DBE0; margin:44px 0;}
  .a-label{
    font-family:"JetBrains Mono",monospace; font-size:14px; letter-spacing:.08em; text-transform:uppercase;
    color:#B14E20; margin-bottom:14px;
  }
  .answer{
    font-size:30px; line-height:1.4; color:#1B1F2A; max-width:820px; font-weight:600;
  }
  .spacer{flex:1;}
  .footer{
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:38px; height:30px;}
  .logo-text{font-family:"Fraunces",serif; font-weight:700; font-size:30px; color:#1B1F2A;}
  .logo-text span{color:#B14E20;}
  .cta{
    background:#B14E20; color:#FFFFFF;
    font-weight:700; font-size:28px;
    padding:20px 44px; border-radius:100px;
  }
</style></head>
<body>
<div class="canvas">
  <div class="eyebrow">Before you start</div>
  <div class="qmark">?</div>
  <div class="question">Do I need a credit card to try an AI voice &amp; writing workspace?</div>

  <div class="divider"></div>

  <div class="a-label">Answer</div>
  <div class="answer">No. 10,000 free credits every month, no card required to start.</div>

  <div class="spacer"></div>

  <div class="footer">
    <div class="logo">
      <svg viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="1.2" width="24" height="18.8" rx="4" stroke="#1B1F2A" stroke-width="2.2"/>
        <path d="M9.5 6.1L18.5 15.1M18.5 6.1L9.5 15.1" stroke="#B14E20" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">tab-<span>zero</span></span>
    </div>
    <div class="cta">See how it works</div>
  </div>
</div>
</body></html>
